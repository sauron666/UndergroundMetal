name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel previous runs of the same branch on push to avoid CI pile-ups.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time DB URL is a placeholder — every server query in pages catches
  # connection errors so the static build still succeeds without a DB. Real
  # migrations run in a separate workflow against the production DB.
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/x
  DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/x
  AUTH_SECRET: ci-only-not-secret
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: typecheck + lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm perf:budget

  unit:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm test:unit

  e2e:
    name: playwright smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: undergroundmetal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/undergroundmetal_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/undergroundmetal_test
      AUTH_SECRET: ci-only-not-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma db seed || echo "no seed"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
